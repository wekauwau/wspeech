# Docker Compose for local development with GCP services
# Uses Cloud SQL Auth Proxy to connect to Cloud SQL

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  piper:
    image: rhasspy/wyoming-piper:2.3.1
    command: --voice en_US-lessac-medium
    ports:
      - '127.0.0.1:10200:10200'
    volumes:
      - piper_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python3 -c "import socket; s=socket.create_connection((''127.0.0.1'',10200),2); s.close()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Cloud SQL Auth Proxy for production database access
  # Uncomment when using Cloud SQL
  # cloudsql-proxy:
  #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
  #   command:
  #     - --port=5432
  #     - ${PROJECT_ID}:${REGION}:${INSTANCE_NAME}
  #   ports:
  #     - '127.0.0.1:5432:5432'
  #   volumes:
  #     - ~/.gcloud/application_default_credentials.json:/config/application_default_credentials.json:ro
  #   environment:
  #     - GOOGLE_APPLICATION_CREDENTIALS=/config/application_default_credentials.json

volumes:
  postgres_data:
  redis_data:
  piper_data:
